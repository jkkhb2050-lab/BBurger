 units:["days","hours","min","sec"],dealSoon:"Rs 99 burger deal starts in",dealLive:"Rs 99 burger deal ends in",

 popBurger:"Afghani Burger",skip:"Maybe later",popAl:"Rs 99 burger deal",
 mNew:"*New Order - Bamboo Burger*",mName:"Name",mPhone:"Phone",mType:"Order type",mAddr:"Address",mItems:"Items",mNote:"Notes",mPayDel:"Payment: Cash on delivery",mPayPick:"Payment: Cash on pickup"}
};
/* ====================== */

let L="fa"; try{const v=localStorage.getItem("bb_lang");if(v==="en"||v==="fa")L=v}catch(e){}
const t=k=>D[L][k], li=()=>L==="fa"?0:1;
const U=(id,x,y,w,h,s="")=>`<use href="#${id}" x="${x}" y="${y}" width="${w}" height="${h}" style="${s}"/>`;
const ART={
 deal:()=>U("burger",40,10,110,110)+`<circle cx="160" cy="38" r="27" fill="#a8232f" stroke="#f2b31d" stroke-width="3"/><text x="160" y="49" text-anchor="middle" font-family="Alfa Slab One,serif" font-size="30" fill="#fff">99</text>`,
 c1:()=>U("burger",18,14,108,108)+U("cola",128,20,56,80),
 c2:()=>U("burger",18,14,108,108,"--p:#d98a2b")+U("cola",128,20,56,80),
 c3:()=>U("burger",-8,26,92,92)+U("burger",50,10,104,104)+U("cola",144,26,52,74),
 fries:()=>U("fries",50,10,100,112),
 cola:()=>U("cola",60,8,80,114),
 chutney:()=>U("chutney",45,10,110,110)
};
const $=s=>document.querySelector(s), fmt=n=>t("fmt")(n.toLocaleString("en-US")), find=id=>MENU.find(m=>m.id===id);
const phase=()=>{const n=Date.now();return n<START?"soon":n<=END?"live":"over"};
let cart={},cat="all",type="Delivery";
try{cart=JSON.parse(localStorage.getItem("bb_cart")||"{}")||{};Object.keys(cart).forEach(k=>{if(!find(k))delete cart[k]})}catch(e){}
const save=()=>{try{localStorage.setItem("bb_cart",JSON.stringify(cart))}catch(e){}};
const visible=()=>MENU.filter(m=>m.id!=="deal"||phase()!=="over");

function renderTabs(){
 const cats=["all",...new Set(visible().map(m=>m.cat))];
 $("#tabs").innerHTML=cats.map(c=>`<button class="tab" aria-pressed="${c===cat}" data-c="${c}">${t(c)}</button>`).join("");
}
function renderMenu(){
 const i=li();
 $("#grid").innerHTML=visible().filter(m=>cat==="all"||m.cat===cat).map(m=>{
  const q=cart[m.id]||0, locked=m.id==="deal"&&phase()==="soon", nm=m.n[i];
  const pic=`<div class="pic"><svg class="art" viewBox="0 0 200 130" role="img" aria-label="${nm}">${ART[m.art]()}</svg>${m.img?`<img src="${m.img}" alt="${nm}" loading="lazy" onerror="this.remove()">`:""}</div>`;
  return `<article class="card${m.id==="deal"?" hot":""}">${pic}<div class="body">${m.tag?`<span class="tag">${m.tag[i]}</span>`:""}<h3>${nm}</h3><p>${m.d[i]}</p>
  <div class="row"><span class="price">${fmt(m.price)}</span>
  ${locked?`<button class="add" disabled>${t("soonBtn")}</button>`:q?`<div class="qty"><button data-m="${m.id}" aria-label="${t("less")}">−</button><span>${q}</span><button data-p="${m.id}" aria-label="${t("more")}">+</button></div>`:`<button class="add" data-p="${m.id}">${t("add")}</button>`}</div></div></article>`}).join("");
}
function totals(){
 const sub=Object.entries(cart).reduce((s,[id,q])=>s+find(id).price*q,0), n=Object.values(cart).reduce((a,b)=>a+b,0);
 const fee=type==="Delivery"&&sub>0?DELIVERY_FEE:0;
 return {sub,n,fee,total:sub+fee};
}
function renderCart(){
 if(phase()!=="live"&&cart.deal){delete cart.deal;save()}
 const t0=totals(), ids=Object.keys(cart), i=li();
 $("#count").textContent=t0.n; $("#barCount").textContent=t("items")(t0.n);
 $("#barTotal").textContent=t("view")+" · "+fmt(t0.sub); $("#bar").classList.toggle("show",t0.n>0);
 $("#lines").innerHTML=ids.length?ids.map(id=>{const m=find(id),q=cart[id];return `<div class="line"><div>${m.n[i]}<small>${fmt(m.price)} ${t("each")}</small></div><div class="rt"><div class="qty"><button data-m="${id}" aria-label="${t("less")}">−</button><span>${q}</span><button data-p="${id}" aria-label="${t("more")}">+</button></div><small>${fmt(m.price*q)}</small></div></div>`}).join(""):`<p class="empty">${t("empty")}</p>`;
 $("#totals").innerHTML=ids.length?`<div><span>${t("sub")}</span><span>${fmt(t0.sub)}</span></div>${type==="Delivery"?`<div><span>${t("ship")}</span><span>${t0.fee?fmt(t0.fee):t("free")}</span></div>`:""}<div class="t"><span>${t("total")}</span><span>${fmt(t0.total)}</span></div>`:"";
 $("#send").disabled=!ids.length; $("#addrBox").style.display=type==="Delivery"?"block":"none";
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderMenu();renderCart()}
function openCart(o){$("#drawer").classList.toggle("open",o);$("#overlay").classList.toggle("open",o);$("#drawer").setAttribute("aria-hidden",!o);document.body.style.overflow=o?"hidden":"";if(o)$("#closeCart").focus()}
function send(){
 const name=$("#name").value.trim(),phone=$("#phone").value.trim(),addr=$("#addr").value.trim(),note=$("#note").value.trim(),err=$("#err"),del=type==="Delivery",i=li();err.textContent="";
 if(!name){err.textContent=t("eName");$("#name").focus();return}
 if(phone.replace(/\D/g,"").length<10){err.textContent=t("ePhone");$("#phone").focus();return}
 if(del&&!addr){err.textContent=t("eAddr");$("#addr").focus();return}
 const T=totals(), lines=Object.entries(cart).map(([id,q])=>`• ${q} × ${find(id).n[i]} - ${fmt(find(id).price*q)}`).join("\n");
 const msg=`${t("mNew")}\n\n*${t("mName")}:* ${name}\n*${t("mPhone")}:* ${phone}\n*${t("mType")}:* ${del?t("optDel"):t("optPick")}\n`+(del?`*${t("mAddr")}:* ${addr}\n`:"")+`\n*${t("mItems")}*\n${lines}\n\n*${t("sub")}:* ${fmt(T.sub)}\n`+(del?`*${t("ship")}:* ${T.fee?fmt(T.fee):t("free")}\n`:"")+`*${t("total")}:* ${fmt(T.total)}\n`+(note?`\n*${t("mNote")}:* ${note}\n`:"")+`\n${del?t("mPayDel"):t("mPayPick")}`;
 window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
}

/* countdown + deal messaging */
function tick(){
 const p=phase(); if(p==="over"){document.querySelectorAll(".cd").forEach(e=>e.innerHTML="");return}
 let s=Math.max(0,Math.floor(((p==="soon"?START:END)-Date.now())/1000));
 const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60], l=t("units");
 const h=v.map((x,i)=>`<div><b>${String(x).padStart(2,"0")}</b>${l[i]}</div>`).join("");
 document.querySelectorAll(".cd").forEach(e=>e.innerHTML=h);
}
function setupDeal(){
 if(phase()==="over")return;
 $("#sticker").hidden=false; $("#heroDeal").hidden=false;
 setTimeout(()=>{$("#pop").classList.add("open");$("#popGo").focus()},500);
}
const closePop=()=>$("#pop").classList.remove("open");

/* language */
function applyLang(){
 const rtl=L==="fa", r=document.documentElement;
 r.lang=rtl?"fa-AF":"en"; r.dir=rtl?"rtl":"ltr"; document.title=t("title");
 $('meta[name="description"]').content=t("desc");
 document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=t(e.dataset.t));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 document.querySelectorAll("[data-al]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.al)));
 document.querySelectorAll(".langbar button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
 const p=phase();
 if(p!=="over"){const s=p==="soon";
  $("#heroDealTxt").textContent=t(s?"dealSoon":"dealLive"); $("#popKick").textContent=t(s?"kickSoon":"kickLive");
  $("#popSub").textContent=t(s?"subSoon":"subLive"); $("#popGo").textContent=t(s?"goSoon":"goLive")}
 renderTabs();renderMenu();renderCart();tick();
}
function setLang(l){L=l;try{localStorage.setItem("bb_lang",l)}catch(e){}applyLang()}

document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.dataset.l)setLang(b.dataset.l);
 else if(b.dataset.p)change(b.dataset.p,1); else if(b.dataset.m)change(b.dataset.m,-1);
 else if(b.dataset.c){cat=b.dataset.c;renderTabs();renderMenu()}
 else if(b.dataset.type){type=b.dataset.type;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.type===type));renderCart()}
});
$("#popGo").onclick=()=>{closePop();if(phase()==="live"){change("deal",1);openCart(true)}};
$("#popX").onclick=closePop;$("#popSkip").onclick=closePop;
$("#openCart").onclick=$("#bar").onclick=()=>openCart(true);
$("#closeCart").onclick=$("#overlay").onclick=()=>openCart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);closePop()}});
$("#send").onclick=send; $("#yr").textContent=new Date().getFullYear();
setupDeal();applyLang();setInterval(tick,1000);
</script>
